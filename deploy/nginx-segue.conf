# Segue nginx 설정
#
# 설치 위치: /etc/nginx/sites-available/segue
# 활성화:
#   ln -sf /etc/nginx/sites-available/segue /etc/nginx/sites-enabled/segue
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# 프론트(정적 파일)와 백엔드(API)를 같은 주소에서 서빙한다. 주소가 하나로 통일되므로
# CORS 가 발생하지 않고, 프론트는 baseUrl 없이 /api/... 상대 경로로만 호출하면 된다.

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # --- API 는 백엔드(Spring Boot)로 전달 ---
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;
        # AI(OpenAI) 호출이 포함된 요청은 수 초가 걸리므로 기본 60초보다 넉넉히 잡는다.
        proxy_read_timeout 120s;
    }

    # --- 제품 이미지도 백엔드가 가지고 있다 (src/main/resources/static/images) ---
    location /images/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # --- 프론트 정적 파일 ---
    root /var/www/segue;
    index index.html;

    # 없는 경로는 index.html 로 넘긴다.
    # 프론트가 클라이언트 라우팅을 쓰므로(/staff/home 등) 주소창에 직접 입력하거나
    # 그 화면에서 새로고침해도 404 가 나지 않아야 한다.
    # /api 와 /images 는 위에서 먼저 매칭되므로 이 규칙에 걸리지 않는다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
