spring.application.name=segue-backend

# --- DB 접속 정보: 전부 .env 에서 읽어온다 (SegueBackendApplication.main() 의 DotenvLoader 가 로드) ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- OpenAI (segue-ai 모듈) ---
openai.api.key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# 기능명세서 6번: 재고 확인 정보의 최신성 기준(시간). 이 시간을 넘긴 confirmed 재고는 미확인과 동일하게 처리한다.
#
# 이슈 #19 결정: 12시간으로 확정한다.
# - 신선도를 보는 대상은 재고 수량이 아니라 "CA가 그 SKU를 실제로 확인했는가"이며, 사람이 개입하는
#   행위라 하루 1~2회 수준이다. 12시간은 오픈/마감 2회 확인 주기, 즉 "직전 근무 교대 이내에 확인된
#   것만 확정 경로로 인정한다"는 기준에 해당한다.
# - 짧게/길게 잡을 때의 위험은 비대칭이다. 짧으면 추가 상담(결과 4)이 늘 뿐 틀린 정보가 나가지는
#   않지만, 길면 실제로는 빠진 재고를 "확정 가능"으로 안내하게 된다. 명품 매장에서 후자의 회복
#   비용이 훨씬 크므로 애매하면 짧은 쪽으로 기울인다.
# - 결과 유형별 차등 기준은 두지 않는다. 비교 체험도 "지금 이 매장에 있다"를 전제로 고객을 움직이는
#   결과라 헛걸음 비용이 발생하고, 근거 없는 두 번째 숫자가 생기면 규칙 엔진의 설명 가능성이 깎인다.
inventory.freshness-hours=${INVENTORY_FRESHNESS_HOURS:12}

server.port=${SERVER_PORT:8080}
