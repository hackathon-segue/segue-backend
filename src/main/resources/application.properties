spring.application.name=segue-backend

# --- DB 접속 정보: 전부 .env 에서 읽어온다 (SegueBackendApplication.main() 의 DotenvLoader 가 로드) ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- OpenAI (segue-ai 모듈) ---
openai.api.key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# 기능명세서 6번: 재고 확인 정보의 최신성 기준(시간). 이 시간을 넘긴 confirmed 재고는 미확인과 동일하게 처리한다.
# 구체적인 수치는 팀 테스트 후 조정 대상.
inventory.freshness-hours=${INVENTORY_FRESHNESS_HOURS:12}

server.port=${SERVER_PORT:8080}

# --- 액세스 로그 ---
# 프론트 연동 디버깅용. "프론트가 요청을 아예 안 보낸 것"과 "보냈는데 404/400 인 것"은 브라우저
# 콘솔에서 똑같이 CORS 오류로 보이는 경우가 있어, 백엔드 시점의 요청 기록이 있어야 구분된다.
# 터널(ngrok/cloudflared)이나 배포 환경이 바뀌어도 동일하게 남는다.
#
# 확인: tail -f logs/access_log.<날짜>.log
# 끄기: ACCESS_LOG_ENABLED=false
server.tomcat.accesslog.enabled=${ACCESS_LOG_ENABLED:true}
# directory 는 기본적으로 Tomcat 임시 디렉터리(/var/folders/.../tomcat.8080.XXXX) 기준이라
# 기동할 때마다 경로가 바뀐다. 프로젝트 루트에 고정해야 tail -f 로 계속 볼 수 있다.
server.tomcat.accesslog.directory=${user.dir}/logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
# %t 시각 | %s 상태코드 | %r 요청라인 | Origin 헤더(어느 프론트에서 왔는지) | %{ms}T 처리시간
# 처리시간은 %D 가 아니라 %{ms}T 를 쓴다. Tomcat 11 의 %D 는 마이크로초 단위라 값이 1000배로 보인다.
server.tomcat.accesslog.pattern=%t %s %r origin=%{Origin}i %{ms}Tms
# 기본값(true)이면 버퍼가 찰 때까지 파일에 안 써져서 tail -f 로 실시간 확인이 안 된다.
server.tomcat.accesslog.buffered=false
