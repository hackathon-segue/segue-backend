# ============================================================================
# 운영(배포) 전용 설정
#
# application.properties 의 값을 덮어쓴다. 여기 없는 항목은 공통 설정을 그대로 따른다.
#
# 실행 방법:
#   java -jar segue-backend.jar --spring.profiles.active=prod
# 또는 서버 환경변수로:
#   export SPRING_PROFILES_ACTIVE=prod
#
# 이 프로필을 켜지 않으면 개발 설정으로 뜨므로, 서버에서는 반드시 지정해야 한다.
# ============================================================================

# --- SQL 로깅 끄기 ---
# 개발에서는 켜두지만 운영에서는 반드시 꺼야 한다.
# 조회할 때마다 SQL 이 로그에 쌓여 디스크를 채우고, 무엇보다 파라미터에 고객 전화번호·이메일
# 같은 개인정보가 평문으로 남는다. 정작 필요한 에러 로그도 SQL 에 묻혀 안 보이게 된다.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- 로그 레벨 ---
# 기본(INFO)은 요청마다 프레임워크 로그가 남아 디스크를 빠르게 채운다. 경고 이상만 남기고,
# 우리 코드에서 의도적으로 남기는 로그는 INFO 로 유지한다.
logging.level.root=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN
logging.level.com.segue.backend=INFO

# --- CORS 허용 오리진 ---
# 개발에서는 프론트 개발 서버 포트가 매번 바뀌어 전체(*)를 허용하지만, 운영에서 그대로 두면
# 임의의 웹사이트가 이 API 를 호출할 수 있다. 실제 서비스 주소만 남긴다.
#
# TODO 배포 후 실제 주소로 교체할 것. 여러 개면 쉼표로 구분한다.
#   예) cors.allowed-origins=http://123.45.67.89,https://segue.example.com
#
# 프론트를 백엔드와 같은 주소에서 서빙하면 CORS 가 발생하지 않으므로 이 값은 무의미해진다.
# 그 경우에도 잘못된 요청을 막기 위해 서비스 주소를 그대로 적어 두면 된다.
cors.allowed-origins=http://localhost

# --- 액세스 로그 ---
# 운영에서도 유지한다. 프론트 연동 문제를 "요청이 도달했는지"부터 가려내는 데 필요하고,
# 요청 라인과 상태 코드만 남기므로 본문(개인정보)은 기록되지 않는다.
server.tomcat.accesslog.enabled=true

# --- 에러 응답 ---
# 예외 메시지·스택트레이스가 클라이언트로 나가지 않도록 명시한다. 내부 구조가 노출되면
# 공격 표면이 된다. 우리 API 는 GlobalExceptionHandler 가 만든 message 만 반환한다.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
