# 테스트 전용 설정. 클래스패스에서 src/main/resources/application.properties 보다 우선한다.
#
# 운영 설정은 DB 접속 정보와 OpenAI 키를 .env 에서 ${DB_HOST} 같은 플레이스홀더로 받는데,
# 그 치환은 SegueBackendApplication.main() 의 DotenvLoader 가 수행한다. 테스트는 main() 을
# 거치지 않으므로 플레이스홀더가 그대로 남아 "For input string: ${DB_PORT}" 로 컨텍스트
# 로딩이 실패했다. 게다가 .env 는 커밋되지 않아 저장소를 clone 한 사람에게는 애초에 값이 없다.
#
# 그래서 테스트는 외부 의존성 없이 인메모리 H2 로 독립 실행한다. clone 직후 ./mvnw test 만으로
# 통과해야 한다는 것이 기준이다.

spring.datasource.url=jdbc:h2:mem:segue;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# 실제 OpenAI 호출은 하지 않는다. 키가 없으면 빈 생성 단계에서 실패하므로 더미 값만 채운다.
openai.api.key=test-key-not-used
openai.model=gpt-4o-mini

# 재고 신선도 스케줄러는 테스트에서 불필요하다. 켜 두면 컨텍스트 종료와 경합해 로그만 지저분해진다.
inventory.freshness-refresh.enabled=false
inventory.freshness-hours=12

# 액세스 로그는 운영 디버깅용이라 테스트에서 파일을 만들 이유가 없다.
server.tomcat.accesslog.enabled=false
